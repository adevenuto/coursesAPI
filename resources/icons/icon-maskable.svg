<!--
    Android adaptive ("maskable") variant.

    Android crops this to an arbitrary shape — circle, squircle, rounded square —
    so the background runs full bleed with no corner radius, and the mark is held
    inside the central 60% that every mask is guaranteed to keep.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <rect width="64" height="64" fill="#0a0b0a" />
    <text
        x="32"
        y="38"
        font-family="Sora, Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="17"
        font-weight="800"
        letter-spacing="-0.8"
        text-anchor="middle"
    >
        <tspan fill="#8ae63c">G</tspan><tspan fill="#f5f7f4">CA</tspan>
    </text>
</svg>

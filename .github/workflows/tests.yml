name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # manual "Run workflow" button (Actions tab) for on-demand deploys

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # MySQL for the test suite (the app + tests use MySQL, not sqlite).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: courses_api_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: courses_api_test
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath, intl
          tools: composer:v2
          coverage: none

      # Node is only needed to produce the deploy artifact. The test suite stubs
      # out @vite (see tests/TestCase.php), so pull requests skip npm entirely.
      - name: Setup Node
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer vendor
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend
        # Solely to produce the artifact the deploy job consumes — the tests no
        # longer need compiled assets.
        if: github.event_name != 'pull_request'
        run: |
          npm ci
          npm run build

      - name: Upload built assets
        # Handed to the deploy job so it never repeats the npm install + build.
        # Same commit, same assets — rebuilding there was pure duplication.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-assets
          path: public/build
          if-no-files-found: error
          retention-days: 1

      - name: Run tests
        # Gate is tests-only for now. The stricter `composer ci:check`
        # (pint + phpstan + eslint + prettier + vue-tsc) is deferred until the
        # existing lint/format debt and the PHPStan config crash are cleaned up.
        run: php artisan test

  deploy:
    name: Deploy to production
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Never let two production deploys overlap; queue them instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies (production)
        # Still needed here: the ci job installs dev dependencies, so its vendor/
        # is not what production should run.
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Download built assets
        # Built once by the ci job, which this job already depends on. No Node,
        # no npm ci, no vite build, and no throwaway .env needed here.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-assets
          path: public/build

      - name: Verify build output
        run: test -f public/build/manifest.json

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # || true: a transient keyscan hiccup must not fail the deploy;
          # StrictHostKeyChecking=accept-new below is the backstop.
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync built tree to server
        # In-place deploy (no maintenance page) — brief inconsistency accepted.
        # --delete cleans stale hashed assets in public/build. The excludes
        # protect live server state that must never be overwritten or removed:
        #   .env / .env.*   - production secrets live only on the server
        #   /storage/       - uploads, logs, sessions
        #   /bootstrap/cache - server regenerates these against its own .env
        #   /.htaccess      - root rewrite shim into public/ (server-only, not in repo)
        #   /.well-known/   - ACME/SSL challenge dir Hostinger may create
        #
        # Retried: the host intermittently drops connections from GitHub runner
        # IPs, which surfaces as "connect ... Connection timed out" after the
        # default ~2 minute TCP timeout. ConnectTimeout caps that wait so a bad
        # attempt fails fast and the retry gets a fresh connection; rsync is
        # idempotent, so a partial transfer simply resumes.
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          for attempt in 1 2 3; do
            if rsync -az --delete \
              -e "ssh $SSH_OPTS" \
              --exclude '.git' \
              --exclude '/.github' \
              --exclude '.env' \
              --exclude '.env.*' \
              --exclude '/storage/' \
              --exclude '/public/storage' \
              --exclude '/public/hot' \
              --exclude '/bootstrap/cache/' \
              --exclude '/.htaccess' \
              --exclude '/.well-known/' \
              --exclude '/tests/' \
              --exclude '/node_modules/' \
              --exclude '.claude' \
              --exclude '/dist' \
              ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"; then
              echo "rsync succeeded on attempt $attempt"
              exit 0
            fi

            echo "::warning::rsync attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done

          echo "::error::rsync failed after 3 attempts — the host is refusing connections from this runner"
          exit 1

      - name: Run server bootstrap (migrate + caches)
        # Retried for the same connectivity reason as the rsync. The script is
        # idempotent, so a retry after a dropped connection is safe — but note a
        # failure here leaves new code on the server against old caches, so it
        # must not be allowed to pass silently.
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          for attempt in 1 2 3; do
            if ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "cd '${{ secrets.DEPLOY_PATH }}' && PHP_BIN=php bin/server-bootstrap.sh"; then
              echo "bootstrap succeeded on attempt $attempt"
              exit 0
            fi

            echo "::warning::bootstrap attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done

          echo "::error::bootstrap failed after 3 attempts — the server may be running new code against stale caches"
          exit 1

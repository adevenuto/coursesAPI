<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden;font-family:var(--font-display)}
.wrap{display:flex;width:1280px;height:854px}
.main{width:960px;height:854px;background:var(--grad-aurora),var(--ink-900);display:grid;place-items:center}
.name{font-size:132px;font-weight:700;letter-spacing:-.03em;color:var(--text-primary)}
.name b{color:var(--lime-400);font-weight:700}
.strip{width:320px;height:854px;display:flex;flex-direction:column}
.strip div{flex:1}</style></head>
<body><div class="wrap">
<div class="main"><div class="name">Trainer<b>Flow</b></div></div>
<div class="strip">
<div style="background:var(--lime-300)"></div>
<div style="background:var(--lime-500)"></div>
<div style="background:var(--emerald-500)"></div>
<div style="background:var(--emerald-700)"></div>
</div>
</div></body></html>

<!-- @dsCard group="Colors" viewport="700x150" name="Emerald — secondary / glow" subtitle="Deeper green for aurora glow and success" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--ink-900);font-family:var(--font-body);padding:20px}
.row{display:flex;gap:10px}.sw{flex:1;height:88px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:600;color:#fff}.h{font-size:11px;font-family:var(--font-mono);color:rgba(255,255,255,.65)}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--emerald-400)"><span class="n" style="color:#062">400</span><span class="h" style="color:rgba(0,40,10,.6)">#4ade80</span></div>
<div class="sw" style="background:var(--emerald-500)"><span class="n">500</span><span class="h">#22c55e</span></div>
<div class="sw" style="background:var(--emerald-600)"><span class="n">600</span><span class="h">#16a34a</span></div>
<div class="sw" style="background:var(--emerald-700)"><span class="n">700</span><span class="h">#15803d</span></div>
</div></body></html>

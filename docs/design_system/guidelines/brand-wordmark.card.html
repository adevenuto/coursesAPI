<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--ink-900);padding:22px;font-family:var(--font-display);display:flex;gap:34px;align-items:center}
.mark{display:flex;align-items:center;gap:11px;font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--text-primary)}
.dot{width:26px;height:26px;border-radius:8px;background:var(--grad-lime);display:grid;place-items:center}
.dot svg{width:15px;height:15px}</style></head>
<body>
<div class="mark"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#0a1400" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h4l3-8 4 16 3-8h2"/></svg></span>TrainerFlow</div>
<div class="mark" style="background:var(--grad-lime);-webkit-background-clip:text;background-clip:text;color:transparent">TrainerFlow</div>
</body></html>

<!-- @dsCard group="Brand" viewport="700x170" name="Gradients & glow" subtitle="Lime CTA gradient, card glow, CTA shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--ink-900);padding:22px;font-family:var(--font-body);display:flex;gap:14px}
.b{flex:1;height:110px;border-radius:16px;display:flex;align-items:flex-end;padding:12px;box-sizing:border-box;font-size:12px;font-weight:600}
.l{font-family:var(--font-mono);font-size:10px;font-weight:400;opacity:.75}</style></head>
<body>
<div class="b" style="background:var(--grad-lime);color:#0a1400">lime CTA<br><span class="l">--grad-lime</span></div>
<div class="b" style="background:var(--surface-card);box-shadow:var(--glow-cta);color:var(--text-primary)">CTA glow<br><span class="l">--glow-cta</span></div>
<div class="b" style="background:var(--surface-card);border:1px solid var(--border-subtle);color:var(--text-secondary);position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:var(--grad-card-glow)"></div><span style="position:relative">card glow<br><span class="l">--grad-card-glow</span></span></div>
</body></html>

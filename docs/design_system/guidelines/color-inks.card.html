<!-- @dsCard group="Colors" viewport="700x160" name="Inks — surfaces & neutrals" subtitle="Green-tinted charcoals from page to raised" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#000;font-family:var(--font-body);padding:20px}
.row{display:flex;gap:8px}.sw{flex:1;height:96px;border-radius:12px;border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:600;color:var(--text-primary)}.h{font-size:10.5px;font-family:var(--font-mono);color:var(--text-tertiary)}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--black)"><span class="n">black</span><span class="h">#050605</span></div>
<div class="sw" style="background:var(--ink-900)"><span class="n">900 · page</span><span class="h">#0a0b0a</span></div>
<div class="sw" style="background:var(--ink-800)"><span class="n">800 · card</span><span class="h">#111311</span></div>
<div class="sw" style="background:var(--ink-750)"><span class="n">750 · input</span><span class="h">#161815</span></div>
<div class="sw" style="background:var(--ink-700)"><span class="n">700 · raised</span><span class="h">#1c1e1b</span></div>
<div class="sw" style="background:var(--ink-600)"><span class="n">600</span><span class="h">#262925</span></div>
<div class="sw" style="background:var(--ink-500)"><span class="n">500</span><span class="h">#363a35</span></div>
</div></body></html>

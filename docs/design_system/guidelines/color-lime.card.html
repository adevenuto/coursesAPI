<!-- @dsCard group="Colors" viewport="700x150" name="Lime — primary accent" subtitle="Electric chartreuse; CTAs, highlights, bars, stats" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--ink-900);font-family:var(--font-body);padding:20px}
.row{display:flex;gap:10px}.sw{flex:1;height:88px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.n{font-size:11px;font-weight:600;color:#0a1400}.h{font-size:11px;font-family:var(--font-mono);color:rgba(10,20,0,.6)}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--lime-200)"><span class="n">200</span><span class="h">#d7f8a6</span></div>
<div class="sw" style="background:var(--lime-300)"><span class="n">300</span><span class="h">#b6f16e</span></div>
<div class="sw" style="background:var(--lime-400)"><span class="n">400</span><span class="h">#9aea47</span></div>
<div class="sw" style="background:var(--lime-500);outline:2px solid #fff;outline-offset:2px"><span class="n">500 ●</span><span class="h">#8ae63c</span></div>
<div class="sw" style="background:var(--lime-600)"><span class="n">600</span><span class="h">#6fc42a</span></div>
<div class="sw" style="background:var(--lime-700)"><span class="n" style="color:#fff">700</span><span class="h" style="color:rgba(255,255,255,.6)">#559a1f</span></div>
</div></body></html>

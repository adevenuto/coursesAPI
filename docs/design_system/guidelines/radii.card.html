<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="6→28px, pills fully round" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--ink-900);padding:22px;font-family:var(--font-body);display:flex;gap:16px;align-items:center}
.c{display:flex;flex-direction:column;align-items:center;gap:8px}.b{width:64px;height:64px;background:var(--ink-700);border:1px solid var(--border-lime);border-bottom-left-radius:0;border-bottom-right-radius:0}
.l{font-family:var(--font-mono);font-size:10.5px;color:var(--text-tertiary)}</style></head>
<body>
<div class="c"><div class="b" style="border-top-left-radius:6px;border-top-right-radius:6px"></div><span class="l">sm 6</span></div>
<div class="c"><div class="b" style="border-top-left-radius:12px;border-top-right-radius:12px"></div><span class="l">md 12</span></div>
<div class="c"><div class="b" style="border-top-left-radius:16px;border-top-right-radius:16px"></div><span class="l">lg 16</span></div>
<div class="c"><div class="b" style="border-top-left-radius:20px;border-top-right-radius:20px"></div><span class="l">xl 20</span></div>
<div class="c"><div class="b" style="border-top-left-radius:28px;border-top-right-radius:28px"></div><span class="l">2xl 28</span></div>
<div class="c"><div class="b" style="width:120px;border-radius:999px 999px 0 0"></div><span class="l">pill 999</span></div>
</body></html>
